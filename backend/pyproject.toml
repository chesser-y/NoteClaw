[project]
name = "noteclaw-backend"
version = "0.1.0"
description = "FastAPI backend for the NoteClaw personal knowledge assistant."
readme = "README.md"
authors = [
    { name = "chesser-y", email = "508955021@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "nanobot-ai",
    "numpy>=2.4.6",
    "openai>=2.44.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.50.0",
]

[project.scripts]
noteclaw-backend = "noteclaw_backend.main:run"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
nanobot-ai = { path = "../nanobot" }
